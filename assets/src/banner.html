<style>
  html,body{margin:0;padding:0}
  .b{position:relative;width:772px;height:250px;overflow:hidden;
     background:linear-gradient(135deg,#0f172a 0%,#1e293b 100%);
     font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
  .grid{position:absolute;inset:0;opacity:.05;
     background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);
     background-size:50px 50px}
  .glow{position:absolute;border-radius:50%;background:#8b5cf6;filter:blur(60px)}
  .g1{width:260px;height:260px;right:-60px;top:-90px;opacity:.26}
  .g2{width:200px;height:200px;left:-80px;bottom:-90px;opacity:.10}
  .wrap{position:absolute;left:52px;top:44px;display:flex;gap:30px;align-items:flex-start}
  .mark{width:92px;height:92px;flex:none}
  .kicker{font-size:13px;letter-spacing:2.6px;font-weight:600;color:#8b5cf6;text-transform:uppercase;margin:2px 0 12px}
  .h{font-size:27px;line-height:1.24;font-weight:700;color:#fff;letter-spacing:-.4px;margin:0}
  .h em{font-style:normal;color:#94a3b8}
  .rule{width:64px;height:3px;border-radius:2px;background:#8b5cf6;opacity:.7;margin-top:18px}
  .chips{position:absolute;right:44px;top:78px;display:flex;flex-direction:column;gap:14px;align-items:flex-end}
  .chip{display:flex;align-items:center;gap:10px;padding:9px 16px;border-radius:999px;
        border:1px solid rgba(148,163,184,.28);background:rgba(15,23,42,.5);
        font-size:13px;font-weight:600;letter-spacing:.3px;color:#cbd5e1}
  .chip b{font-size:15px;font-weight:700;color:#e2e8f0;letter-spacing:0}
  .chip .tag{font-size:11px;letter-spacing:1.4px;text-transform:uppercase}
  .held .tag{color:#a78bfa}
  .pass .tag{color:#94a3b8}
  .dot{width:7px;height:7px;border-radius:50%}
  .held .dot{background:#a78bfa}
  .pass .dot{background:#64748b}
</style>
<div class="b">
  <div class="grid"></div><div class="glow g1"></div><div class="glow g2"></div>
  <div class="wrap">
    <svg class="mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
      <path d="M 74 62 L 50 62 L 50 194 L 74 194" fill="none" stroke="#8b5cf6" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 182 62 L 206 62 L 206 194 L 182 194" fill="none" stroke="#8b5cf6" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="84" y="92"  width="88" height="15" rx="7.5" fill="#8b5cf6"/>
      <rect x="84" y="120" width="72" height="15" rx="7.5" fill="#fff"/>
      <rect x="84" y="148" width="88" height="15" rx="7.5" fill="#fff" opacity="0.7"/>
    </svg>
    <div>
      <div class="kicker">Digitizer AI Agent Log</div>
      <p class="h">What the agents changed.<br><em>Not what your team did.</em></p>
      <div class="rule"></div>
    </div>
  </div>
  <div class="chips">
    <div class="chip held"><span class="dot"></span><b>Automation</b><span class="tag">logged</span></div>
    <div class="chip pass"><span class="dot"></span><b>People</b><span class="tag">never</span></div>
  </div>
</div>
